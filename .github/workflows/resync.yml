name: Canva to Dropbox Daily Re-Sync

on:
  schedule:
    # 10:30 AM ET = 14:30 UTC during EDT (roughly Mar-Nov), 15:30 UTC during EST (Nov-Mar).
    # GitHub cron is UTC-only and doesn't adjust for daylight saving on its own,
    # so both lines are here; each no-ops harmlessly on the "wrong" half of the year
    # since the script doesn't check the time itself -- it'll just run twice a year
    # on the transition days. Adjust manually if you want to tighten that up later.
    - cron: '30 14 * * *'
    - cron: '30 15 * * *'
  workflow_dispatch: {}

jobs:
  resync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run re-sync script
        env:
          CANVA_CLIENT_ID: ${{ secrets.CANVA_CLIENT_ID }}
          CANVA_CLIENT_SECRET: ${{ secrets.CANVA_CLIENT_SECRET }}
          CANVA_REFRESH_TOKEN: ${{ secrets.CANVA_REFRESH_TOKEN }}
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python -u resync.py
